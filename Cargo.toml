[package]
name = "WireGuard-Keysmith"
version = "0.1.0"
edition = "2024"

[dependencies]
x25519-dalek = { version = "2.0", features = ["static_secrets"]}
rand = "0.8"
base64 = "0.22.1"
rayon = "1.11.0"
fiat-crypto = "0.2"

[features]
# GPU search via CUDA (needs nvcc; CUDA_PATH defaults to /opt/cuda)
cuda = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
